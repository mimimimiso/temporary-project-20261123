name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "tools/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RemoteShutter.xcodeproj \
            -scheme RemoteShutter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/RemoteShutter.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry RemoteShutter.ipa Payload
          ls -lh RemoteShutter.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteShutter-build${{ github.run_number }}
          path: RemoteShutter.ipa
          retention-days: 14
